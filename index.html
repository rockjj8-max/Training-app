<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Hybrid Training Log</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">ENTRENAMIENTO HÍBRIDO</div>
        <h1 id="pageTitle">Hoy</h1>
      </div>
      <button class="icon-btn" id="quickExportBtn" title="Exportar datos">⇩</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-view="today" class="nav-item active"><span>●</span><small>Hoy</small></button>
      <button data-view="routines" class="nav-item"><span>▦</span><small>Rutinas</small></button>
      <button data-view="history" class="nav-item"><span>◷</span><small>Historial</small></button>
      <button data-view="progress" class="nav-item"><span>↗</span><small>Progreso</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>Ajustes</small></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <div id="modalContent"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
